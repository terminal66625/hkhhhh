  <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Python爱心</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>
<h2>Python 爱心</h2>
<pre id="out"></pre>
<script>
async function run(){
    let pyodide = await loadPyodide();
    let code = `
import math
def heart():
    for y in [1.5 - i*0.1 for i in range(30)]:
        line=""
        for x in [-1.5 + j*0.05 for j in range(60)]:
            if (x**2 + y**2 -1)**3 - x**2 * y**3 <= 0:
                line += "*"
            else:
                line += " "
        print(line)
heart()
`;
    let result = await pyodide.runPythonAsync(code);
    document.getElementById("out").innerText = result;
}
run();
</script>
</body>
</html>
