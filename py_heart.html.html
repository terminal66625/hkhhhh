<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>爱心表白</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:100vw;height:100vh;overflow:hidden;background:#fff;font-family:"微软雅黑",sans-serif;position:relative;}
.pop{position:absolute;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.2);padding:6px 10px;font-size:13px;font-weight:bold;white-space:nowrap;}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;padding:20px;background:#fff;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.3);text-align:center;z-index:999;}
.modal h3{font-size:16px;font-weight:normal;margin-bottom:20px;}
.btn-group button{width:80px;height:30px;margin:0 12px;border:none;border-radius:3px;cursor:pointer;font-size:14px;}
.btn-yes{background:#ff6b81;color:#fff;}
.btn-no{background:#f0f0f0;color:#333;}
.tip{position:fixed;top:calc(50% - 80px);left:50%;transform:translateX(-50%);padding:15px 20px;background:#FFE4E1;color:#8B0000;border-radius:4px;font-size:15px;font-weight:bold;z-index:1000;}
</style>
</head>
<body>

<div class="modal" id="confess">
  <h3>你愿意做我的女朋友吗？</h3>
  <div class="btn-group">
    <button class="btn-yes" onclick="agree()">愿意</button>
    <button class="btn-no" onclick="refuse()">不愿意</button>
  </div>
</div>

<script>
const COLORS = [
  ["#FFB6C1", "#8B0000"],
  ["#ADD8E6", "#003366"],
  ["#FFFACD", "#8B7500"],
  ["#98FB98", "#006400"],
  ["#FFDAB9", "#CD6600"],
  ["#E6E6FA", "#483D8B"]
];

const TEXTS = [
  "多喝热水", "好好吃饭", "保持好心情", "照顾好自己",
  "我想你了", "别熬夜", "天凉了多穿衣服", "顺顺利利",
  "天天开心", "好好爱自己", "是你就好", "一切都好",
  "记得想我", "少点烦恼", "平安喜乐", "万事胜意"
];

const sw = window.innerWidth;
const sh = window.innerHeight;
let tipBox = null;

// 爱心坐标公式
function heartPos(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  return [
    Math.floor(sw/2 + x*22 - 55),
    Math.floor(sh/2 - y*22 - 15)
  ];
}

// 随机颜色
function randomColor() {
  return COLORS[Math.floor(Math.random()*COLORS.length)];
}

// 创建小窗口
function makePop(x, y, text, bg, fg) {
  const div = document.createElement('div');
  div.className = 'pop';
  div.style.left = x + 'px';
  div.style.top = y + 'px';
  div.style.background = bg;
  div.style.color = fg;
  if (text) div.innerText = text;
  document.body.appendChild(div);
  return div;
}

// 不愿意按钮
function refuse() {
  if (tipBox) return;
  tipBox = document.createElement('div');
  tipBox.className = 'tip';
  tipBox.innerText = '想清楚再选！再给你一次机会～';
  document.body.appendChild(tipBox);
  setTimeout(() => {
    tipBox.remove();
    tipBox = null;
  }, 2000);
}

// 愿意按钮：开始动画
function agree() {
  document.getElementById('confess').style.display = 'none';
  if (tipBox) { tipBox.remove(); tipBox = null; }
  startAnimation();
}

// 完整动画流程
async function startAnimation() {
  const heartList = [];
  const N = 120;

  // 1. 画爱心轮廓
  for (let i = 0; i < N; i++) {
    const t = i * (2 * Math.PI / N);
    const [x, y] = heartPos(t);
    const [bg, fg] = randomColor();
    heartList.push(makePop(x, y, '', bg, fg));
    await sleep(20);
  }

  // 2. 倒序删除爱心
  for (let i = heartList.length - 1; i >= 0; i--) {
    heartList[i].remove();
    await sleep(10);
  }

  // 3. 满屏随机文字
  const target = Math.max(60, Math.min(300, Math.floor(sw/120) * Math.floor(sh/40)));
  const textList = [];
  for (let i = 0; i < target; i++) {
    const x = Math.floor(Math.random() * (sw - 120));
    const y = Math.floor(Math.random() * (sh - 45));
    const [bg, fg] = randomColor();
    const text = TEXTS[Math.floor(Math.random()*TEXTS.length)];
    textList.push(makePop(x, y, text, bg, fg));
    await sleep(10);
  }

  // 4. 停留5秒
  await sleep(5000);

  // 5. 随机逐个消失
  textList.sort(() => Math.random() - 0.5);
  for (const w of textList) {
    w.remove();
    await sleep(20);
  }
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// 禁止关闭页面
window.onbeforeunload = function(e) {
  e.returnValue = '想清楚再关哦～';
};
</script>
</body>
</html>
