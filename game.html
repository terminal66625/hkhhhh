<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>爱心捕捉大作战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:100vw;height:100vh;overflow:hidden;font-family:"微软雅黑",sans-serif;
  background:linear-gradient(160deg,#fff5f7,#ffe4e9,#fde2e4);position:relative;}
.hud{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:24px;
  background:rgba(255,255,255,.7);backdrop-filter:blur(10px);padding:10px 22px;border-radius:30px;
  box-shadow:0 6px 20px rgba(255,107,129,.25);z-index:10;font-weight:bold;color:#ff6b81;}
.fall-heart{position:absolute;top:-60px;cursor:pointer;user-select:none;color:#ff6b81;
  text-shadow:0 2px 8px rgba(255,107,129,.4);animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg);}}
.score-pop{position:fixed;pointer-events:none;color:#ff6b81;font-weight:bold;z-index:20;
  animation:popUp .7s ease-out forwards;}
@keyframes popUp{0%{transform:translate(-50%,-50%) scale(.7);opacity:1;}
  100%{transform:translate(-50%,-180%) scale(1.3);opacity:0;}}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:320px;padding:28px 20px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-radius:18px;text-align:center;
  box-shadow:0 12px 40px rgba(255,107,129,.3);z-index:999;animation:modalIn .5s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes modalIn{from{transform:translate(-50%,-50%) scale(.7);opacity:0;}to{transform:translate(-50%,-50%) scale(1);opacity:1;}}
.modal h2{font-size:22px;color:#ff6b81;margin-bottom:10px;}
.modal p{font-size:15px;color:#666;line-height:1.7;margin-bottom:20px;}
.modal button{margin:6px 8px;padding:10px 20px;border:none;border-radius:24px;cursor:pointer;
  font-size:14px;font-weight:bold;color:#fff;background:linear-gradient(135deg,#ff6b81,#ff8fa3);
  box-shadow:0 4px 14px rgba(255,107,129,.45);}
.modal button.ghost{background:#f0f0f0;color:#666;box-shadow:none;}
</style>
</head>
<body>
<div class="hud"><span>得分 <span id="score">0</span></span><span>时间 <span id="time">30</span>s</span></div>

<div class="modal" id="result" style="display:none;">
  <h2 id="rating">太棒啦！</h2>
  <p id="msg">你一共接住了 0 颗爱心</p>
  <div>
    <button onclick="restart()">再玩一次</button>
    <button class="ghost" onclick="location.href='py_heart.html'">回表白页</button>
  </div>
</div>

<script>
var score = 0, timeLeft = 30, gameOver = false;
var scoreEl = document.getElementById('score');
var timeEl = document.getElementById('time');

function beep(f) {
  try {
    var c = new (window.AudioContext || window.webkitAudioContext)();
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = f; g.gain.value = 0.12;
    o.connect(g); g.connect(c.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.15);
    o.stop(c.currentTime + 0.15);
  } catch(e) {}
}

function spawn() {
  if (gameOver) return;
  var h = document.createElement('span');
  h.className = 'fall-heart';
  h.textContent = '♥';
  h.style.left = (Math.random() * (window.innerWidth - 40)) + 'px';
  h.style.fontSize = (20 + Math.random() * 30) + 'px';
  var dur = 2.5 + Math.random() * 2.5;
  h.style.animationDuration = dur + 's';
  h.addEventListener('click', function(ev) { ev.stopPropagation(); catchHeart(h); });
  document.body.appendChild(h);
  setTimeout(function() { if (h.parentNode) h.remove(); }, dur * 1000 + 100);
  if (!gameOver) setTimeout(spawn, 240 + Math.random() * 360);
}

function catchHeart(h) {
  score++;
  scoreEl.textContent = score;
  beep(600 + score * 20);
  var x = parseFloat(h.style.left) + 20, y = h.getBoundingClientRect().top;
  var p = document.createElement('span');
  p.className = 'score-pop';
  p.textContent = '+1';
  p.style.left = x + 'px';
  p.style.top = y + 'px';
  document.body.appendChild(p);
  setTimeout(function() { p.remove(); }, 700);
  h.remove();
}

function tick() {
  if (gameOver) return;
  timeLeft--;
  timeEl.textContent = timeLeft;
  if (timeLeft <= 0) end();
}

function end() {
  gameOver = true;
  var ratings = [
    ["再接再厉", "emmm 手速有点慢哦，但心意到了～"],
    ["还不错嘛", "有点东西，继续加油～"],
    ["爱心达人", "手速惊人，爱意满满～"],
    ["爱心王者", "你就是我命中注定的那个人！"]
  ];
  var r;
  if (score < 10) r = ratings[0];
  else if (score < 20) r = ratings[1];
  else if (score < 35) r = ratings[2];
  else r = ratings[3];
  document.getElementById('rating').textContent = r[0];
  document.getElementById('msg').textContent = '你一共接住了 ' + score + ' 颗爱心，' + r[1];
  document.getElementById('result').style.display = 'block';
}

function restart() { location.reload(); }

spawn();
setInterval(tick, 1000);
</script>
</body>
</html>
