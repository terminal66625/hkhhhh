<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>终极惊喜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:100vw;height:100vh;overflow:hidden;background:#1a1030;font-family:"微软雅黑",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
canvas{position:fixed;inset:0;z-index:0;}
.heart-big{position:relative;z-index:5;font-size:80px;color:#ff6b81;animation:beat 1s ease-in-out infinite;
  text-shadow:0 0 30px rgba(255,107,129,.8);}
@keyframes beat{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
.card{position:relative;z-index:5;margin-top:24px;max-width:560px;padding:30px 34px;
  background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border-radius:20px;color:#fff;
  border:1px solid rgba(255,255,255,.2);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);}
.card p{font-size:18px;line-height:2;min-height:2em;white-space:pre-wrap;}
.cursor{display:inline-block;width:2px;height:1em;background:#ff8fa3;margin-left:2px;vertical-align:-2px;animation:blink .7s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="heart-big">♥</div>
<div class="card"><p id="type"></p><span class="cursor" id="cursor"></span></div>

<script>
var text = "嗨，看到这里说明你心里已经有我了～\n\n遇见你之后，我才发现：\n“多喝热水”是真的想对你好，\n“早点睡哦”是真的舍不得你熬夜，\n满屏的爱心，都是我憋了很久的话。\n\n所以，最后再认真问一次——\n你，愿意做我的女朋友吗？ ♥";
var i = 0, el = document.getElementById('type'), cur = document.getElementById('cursor');
function type() {
  if (i < text.length) {
    el.textContent += text.charAt(i);
    i++;
    setTimeout(type, 70);
  } else {
    cur.style.display = 'none';
  }
}
type();

// 烟花效果
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W, H;
function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);
var parts = [];
function launch() {
  var x = Math.random() * W, y = Math.random() * H * 0.5;
  var hue = Math.floor(Math.random() * 360);
  for (var k = 0; k < 60; k++) {
    var a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 4;
    parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 60 + Math.random() * 40, hue: hue });
  }
}
function loop() {
  ctx.fillStyle = 'rgba(26,16,48,0.18)';
  ctx.fillRect(0, 0, W, H);
  for (var j = parts.length - 1; j >= 0; j--) {
    var p = parts[j];
    p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life--;
    ctx.globalAlpha = Math.max(0, p.life / 100);
    ctx.fillStyle = 'hsl(' + p.hue + ',90%,65%)';
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2); ctx.fill();
    if (p.life <= 0) parts.splice(j, 1);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
}
setInterval(launch, 600);
loop();
</script>
</body>
</html>
